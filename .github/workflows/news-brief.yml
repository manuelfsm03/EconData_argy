name: news-brief

# Genera el "morning brief" de coyuntura AR 2 veces por día.
#  - 07:00 AR = 10:00 UTC (morning)
#  - 12:00 AR = 15:00 UTC (noon)
# También corre a demanda con workflow_dispatch (útil para debug).

on:
  schedule:
    - cron: "0 10,15 * * *"
  workflow_dispatch:
    inputs:
      corte:
        description: "morning | noon (opcional, autodetecta por hora UTC)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: news-brief-${{ github.ref }}
  cancel-in-progress: false

jobs:
  brief:
    name: fetch + generate + commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolver corte
        id: corte
        run: |
          if [ -n "${{ github.event.inputs.corte }}" ]; then
            echo "corte=${{ github.event.inputs.corte }}" >> "$GITHUB_OUTPUT"
          else
            HORA=$(date -u +%H)
            if [ "$HORA" -lt 13 ]; then
              echo "corte=morning" >> "$GITHUB_OUTPUT"
            else
              echo "corte=noon" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: npm ci
        run: npm ci --include=dev --no-audit --no-fund

      - name: Fetch RSS crudo
        run: node scripts/fetch-news-raw.mjs ${{ steps.corte.outputs.corte }}

      - name: Generar brief con Claude Haiku
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-news-brief.mjs ${{ steps.corte.outputs.corte }}

      - name: Commit + push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news-raw-*.json public/data/news-brief-*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios en briefs — nada para commitear."
          else
            git commit -m "chore(news): brief ${{ steps.corte.outputs.corte }} $(date -u +%Y-%m-%d)"
            git push
          fi
