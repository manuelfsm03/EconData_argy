name: Actualizar datos provinciales

on:
  schedule:
    # 1ro de cada mes a las 7am UTC (4am Argentina)
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/ms-playwright

jobs:
  empleo-provincias:
    name: Empleo por provincia (OEDE/SIPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        run: npm ci --include=dev --no-audit --no-fund

      # Playwright se instala por si el CDN bloquea las requests directas.
      # El script lo usa como última estrategia (browser real = no hay hotlinking).
      - name: Instalar Chromium (fallback Playwright)
        run: npx playwright install --with-deps chromium

      - name: Descargar y parsear CSV de empleo
        run: node scripts/update-empleo-provincias.mjs

      - name: Verificar JSON generado
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('public/data/empleo-provincias.json'))
          assert d['total_provincias'] >= 20, f'Pocas provincias: {d[\"total_provincias\"]}'
          print(f'OK: {d[\"total_provincias\"]} provincias | {d[\"cobertura\"][\"desde\"]} -> {d[\"cobertura\"][\"hasta\"]}')
          "

      - name: Descargar XLSX de ejecución presupuestaria provincial
        run: node scripts/update-fiscal-provincias.mjs

      - name: Verificar JSON fiscal
        run: |
          python3 -c "
          import json
          d = json.load(open('public/data/fiscal-provincias.json'))
          assert d['total_provincias'] >= 20, f'Pocas provincias: {d[\"total_provincias\"]}'
          print(f'OK fiscal: {d[\"total_provincias\"]} provincias | 2005-{d[\"cobertura\"][\"hasta\"]}')
          "

      - name: Descargar locser.xls del BCRA y generar bancario-provincias.json
        run: node scripts/update-bancario-provincias.mjs

      - name: Verificar JSON bancario
        run: |
          python3 -c "
          import json
          d = json.load(open('public/data/bancario-provincias.json'))
          assert d['total_provincias'] >= 20, f'Pocas provincias: {d[\"total_provincias\"]}'
          print(f'OK bancario: {d[\"total_provincias\"]} provincias | {d[\"cobertura\"][\"desde\"]} -> {d[\"cobertura\"][\"hasta\"]}')
          "

      - name: Descargar CSV de salarios por provincia y generar salarios-provincias.json
        run: node scripts/update-salarios-provincias.mjs

      - name: Verificar JSON salarios
        run: |
          python3 -c "
          import json
          d = json.load(open('public/data/salarios-provincias.json'))
          assert d['total_provincias'] >= 20, f'Pocas provincias: {d[\"total_provincias\"]}'
          print(f'OK salarios: {d[\"total_provincias\"]} provincias | {d[\"cobertura\"][\"desde\"]} -> {d[\"cobertura\"][\"hasta\"]}')
          "

      - name: Commitear si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/empleo-provincias.json public/data/fiscal-provincias.json \
                  public/data/bancario-provincias.json public/data/salarios-provincias.json
          if git diff --cached --quiet; then
            echo "Sin cambios — nada que commitear"
          else
            git commit -m "data: datos provinciales actualizados ($(date +%Y-%m))"
            git push
          fi
