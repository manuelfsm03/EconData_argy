name: Poll alertas

# Corre cada 30 minutos para evaluar las alertas activas y disparar emails.
# También se puede correr a mano desde la pestaña Actions (workflow_dispatch).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: poll-alertas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL:   ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APP_URL:        ${{ vars.APP_URL || 'https://lapizarra.ar' }}
      LAPIZARRA_URL:  ${{ vars.LAPIZARRA_URL || 'https://lapizarra.ar' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Run poller
        run: node scripts/poll-alertas.mjs
