name: Sync from upstream

on:
  schedule:
    - cron: '*/15 * * * *'  # cada 15 min
  workflow_dispatch:  # manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/manuelfsm03/EconData_argy.git || true
          git fetch upstream main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse upstream/main)" ]; then
            git reset --hard upstream/main
            git push origin main --force
            echo "✅ Synced to $(git rev-parse --short upstream/main)"
          else
            echo "⏭️ Already up to date"
          fi
