<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #060606; overflow: hidden; }
    #controls {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 4px;
    }
    .btn {
      background: #111; border: 1px solid #222; color: #666;
      font-family: monospace; font-size: 9px; letter-spacing: 1px;
      padding: 4px 10px; cursor: pointer; border-radius: 3px;
      text-transform: uppercase; transition: all 0.1s;
    }
    .btn.active { border-color: #FFA028; color: #FFA028; background: #1a1200; }
    #chart { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="controls">
    <button class="btn active" onclick="setMode('total')" id="btn-total">Total</button>
    <button class="btn"        onclick="setMode('expo')"  id="btn-expo" >Exportaciones</button>
    <button class="btn"        onclick="setMode('impo')"  id="btn-impo" >Importaciones</button>
    <button class="btn"        onclick="setMode('saldo')" id="btn-saldo">Saldo</button>
  </div>
  <div id="chart"></div>

  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js" charset="utf-8"></script>
  <script>
    // ── Datos (fallback hardcodeado — INDEC/Comtrade 2023/2024) ─────────────────
    const SOCIOS = [
      { iso3: "BRA", nombre: "Brasil",        expo: 11800, impo: 14200 },
      { iso3: "CHN", nombre: "China",          expo:  8900, impo: 18500 },
      { iso3: "USA", nombre: "EE.UU.",         expo:  7400, impo:  8600 },
      { iso3: "CHL", nombre: "Chile",          expo:  4200, impo:  2100 },
      { iso3: "IND", nombre: "India",          expo:  3800, impo:  1200 },
      { iso3: "DEU", nombre: "Alemania",       expo:  1100, impo:  2800 },
      { iso3: "NLD", nombre: "Países Bajos",   expo:  2600, impo:   400 },
      { iso3: "VNM", nombre: "Vietnam",        expo:  2100, impo:   300 },
      { iso3: "URY", nombre: "Uruguay",        expo:  1800, impo:  1500 },
      { iso3: "BOL", nombre: "Bolivia",        expo:   800, impo:  1600 },
      { iso3: "PRY", nombre: "Paraguay",       expo:  1200, impo:   900 },
      { iso3: "ESP", nombre: "España",         expo:   950, impo:  1400 },
      { iso3: "IDN", nombre: "Indonesia",      expo:  1700, impo:   200 },
      { iso3: "EGY", nombre: "Egipto",         expo:  1500, impo:   150 },
      { iso3: "THA", nombre: "Tailandia",      expo:  1300, impo:   180 },
      { iso3: "ARG", nombre: "Argentina",      expo:     0, impo:     0 },
    ]

    let currentMode = 'total'

    function getValue(s, mode) {
      if (s.iso3 === 'ARG') return null
      if (mode === 'total')  return s.expo + s.impo
      if (mode === 'expo')   return s.expo
      if (mode === 'impo')   return s.impo
      if (mode === 'saldo')  return s.expo - s.impo
      return 0
    }

    function getLabel(mode) {
      const labels = { total: 'Intercambio total', expo: 'Exportaciones ARG', impo: 'Importaciones ARG', saldo: 'Saldo comercial ARG' }
      return labels[mode]
    }

    function getColorscale(mode) {
      if (mode === 'saldo') {
        return [
          [0.0, '#FF433D'], [0.4, '#8B2020'], [0.5, '#181818'],
          [0.6, '#1a4d2e'], [1.0, '#4AF6C3']
        ]
      }
      return [
        [0.0, '#0a0a0a'], [0.2, '#1a1000'], [0.5, '#7a3800'],
        [0.8, '#cc7000'], [1.0, '#FFA028']
      ]
    }

    function buildCustomdata(mode) {
      return SOCIOS.map(s => {
        const saldo = s.expo - s.impo
        return [
          s.nombre,
          (s.expo  / 1000).toFixed(1),
          (s.impo  / 1000).toFixed(1),
          (Math.abs(saldo) / 1000).toFixed(1),
          saldo >= 0 ? 'Superávit' : 'Déficit',
          s.iso3
        ]
      })
    }

    function render(mode) {
      const locs  = SOCIOS.map(s => s.iso3)
      const vals  = SOCIOS.map(s => getValue(s, mode))
      const cdata = buildCustomdata(mode)

      const hovertmpl = mode === 'saldo'
        ? '<b>%{customdata[0]}</b><br>' +
          'Expo ARG → : USD %{customdata[1]}B<br>' +
          'Impo ARG ← : USD %{customdata[2]}B<br>' +
          '<b>Saldo: %{customdata[4]} USD %{customdata[3]}B</b><extra></extra>'
        : '<b>%{customdata[0]}</b><br>' +
          'Expo ARG → : USD %{customdata[1]}B<br>' +
          'Impo ARG ← : USD %{customdata[2]}B<br>' +
          'Intercambio: USD %{z}M<extra></extra>'

      const choropleth = {
        type: 'choropleth',
        locationmode: 'ISO-3',
        locations: locs,
        z: vals,
        customdata: cdata,
        hovertemplate: hovertmpl,
        colorscale: getColorscale(mode),
        showscale: true,
        marker: { line: { color: '#1a1a1a', width: 0.5 } },
        colorbar: {
          title: { text: 'USD M', font: { color: '#555', size: 9, family: 'monospace' } },
          tickfont: { color: '#555', size: 8, family: 'monospace' },
          bgcolor: 'rgba(0,0,0,0)',
          bordercolor: '#222',
          thickness: 10,
          len: 0.5,
        },
        zmin: mode === 'saldo' ? -10000 : 0,
      }

      // Argentina marker (siempre naranja)
      const argentina = {
        type: 'choropleth',
        locationmode: 'ISO-3',
        locations: ['ARG'],
        z: [1],
        showscale: false,
        colorscale: [[0, '#FFA028'], [1, '#FFA028']],
        hovertemplate: '<b>Argentina</b><br>País origen<extra></extra>',
        marker: { line: { color: '#FFA028', width: 1 } },
      }

      const layout = {
        geo: {
          showframe: false,
          showcoastlines: true,
          coastlinecolor: '#1a1a1a',
          showland: true,
          landcolor: '#0d0d0d',
          showocean: true,
          oceancolor: '#060606',
          showcountries: true,
          countrycolor: '#1a1a1a',
          bgcolor: '#060606',
          projection: { type: 'natural earth' },
        },
        paper_bgcolor: '#060606',
        plot_bgcolor:  '#060606',
        margin: { l: 0, r: 0, t: 30, b: 0 },
        title: {
          text: `SOCIOS COMERCIALES — ${getLabel(mode).toUpperCase()} (USD millones)`,
          font: { color: '#444', size: 10, family: 'monospace' },
          x: 0.5, xanchor: 'center', y: 0.98, yanchor: 'top',
        },
        font: { family: 'monospace', color: '#555' },
      }

      const config = {
        responsive: true,
        displayModeBar: false,
        scrollZoom: true,
      }

      Plotly.react('chart', [argentina, choropleth], layout, config)
    }

    function setMode(mode) {
      currentMode = mode
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'))
      document.getElementById('btn-' + mode).classList.add('active')
      render(mode)
    }

    // ── Init: intentar cargar datos live de /api/balanza-socios ─────────────────
    fetch('/api/balanza-socios')
      .then(r => r.json())
      .then(j => {
        const live = j.data?.socios
        if (live && live.length > 0) {
          SOCIOS.length = 0
          for (const s of live) {
            SOCIOS.push({ iso3: s.iso, nombre: s.nombre, expo: s.expo, impo: s.impo })
          }
          SOCIOS.push({ iso3: 'ARG', nombre: 'Argentina', expo: 0, impo: 0 })
        }
      })
      .catch(() => {})
      .finally(() => render(currentMode))

    window.addEventListener('resize', () => render(currentMode))
  </script>
</body>
</html>
